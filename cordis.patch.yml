# dsh-fish-memory-pro 的 bundle 层：把自己插进插件树，并且**默认关掉主动遗忘**。
#
# ⚠ 装这个包之前，先把上游 dsh-fish-memory 从 profile 里摘掉 ——
#   两边用的是同一个 id（memory），同时装会出现两条同名条目、配置互相盖。
- insert:
    - id: memory
      name: dsh-fish-memory-pro
      config:
        # 主动遗忘：先记住、再忘掉；只忘已经记住的。默认关，要开自己改成 true。
        主动遗忘: false
        # 用量到窗口的几成开始动手（DSH 官方自动压缩的默认阈值是 0.8，这里抢在它前面）
        遗忘触发比例: 0.55
        # 最近的这么多轮原文一律不动
        保留最近轮: 8
        # 两次成功抽取之间至少隔几轮
        遗忘检查间隔轮: 5
        # 一批最多多少字（太大了模型会飘）
        每批最多字: 12000
        # 一批最多提炼出几条（写进提示词里）
        每批最多条数: 6
        # 一次失败之后，同一段原文隔多久才重试（0 = 不冷却）
        失败冷却分钟: 10
